["简·奥斯汀","Jane Austen","外国","idea human plain lyric","礼貌的对话下面，常常藏着最锋利的判断。","对话机敏，观察精准，擅长写婚姻、阶层、偏见与自我认识。","你喜欢观察人际互动，欣赏聪明对话与细致幽默。","社交礼仪和婚恋制度有时代背景，初读可能觉得范围较窄。","《傲慢与偏见》《理智与情感》"],
["乔治·奥威尔","George Orwell","外国","idea moral real dark","语言如何描述现实，也会影响我们能不能看见现实。","表达清晰，擅长写权力、宣传、阶级与个人自由。","你关心公共议题，习惯质疑话语背后的立场。","政治寓意鲜明，部分作品更像思想警示而非情感探索。","《动物农场》《一九八四》"],
["奥斯卡·王尔德","Oscar Wilde","外国","lyric idea dark plain","漂亮的话不只为取悦人，也可以用来揭开虚伪。","语言华丽机智，擅长悖论与讽刺，讨论美、欲望、名声与道德。","你喜欢精致文字和反讽，也关心美感背后的代价。","部分人物更像观念载体，华丽笔调不一定适合所有人。","《道林·格雷的画像》《温夫人的扇子》"],
["海明威","Ernest Hemingway","外国","plain real inner human","不必把所有情绪说出来，沉默也可以很有分量。","语言简洁，善用行动、对话和留白呈现尊严与失落。","你喜欢准确、节制的表达，相信细节比解释更有力量。","情绪藏得深，喜欢华丽语言或大量心理剖析的人可能觉得冷淡。","《老人与海》《太阳照常升起》"],
["马尔克斯","Gabriel García Márquez","外国","imagine lyric real plot","现实已经足够奇异，想象只是让它显出另一种形状。","把日常、历史、神话与奇幻融合，叙事丰盛，有家族史的厚度。","你喜欢魔幻现实主义，享受家族、历史和想象交织。","人物众多、名字相似，时间线有时需要回看。","《百年孤独》《霍乱时期的爱情》"],
["阿加莎·克里斯蒂","Agatha Christie","外国","plot idea plain human","每个人都只说出一部分真相，阅读就是慢慢拼回全貌。","线索安排巧妙，擅长误导与细节，构建公平又意外的谜题。","你喜欢推理、逻辑和观察细节，享受自己先猜答案。","部分人物更服务于谜题，心理深度不是核心。","《无人生还》《东方快车谋杀案》"],
["维克多·雨果","Victor Hugo","外国","moral human plot lyric","宏大的故事，也可以从一个人的处境开始。","情感浓烈，书写社会不公、救赎、尊严与群体命运。","你喜欢有立场、有情感重量的长篇，也关心社会如何对待弱者。","篇幅很长，常有大段议论与背景介绍。","《悲惨世界》《巴黎圣母院》"],
["夏洛蒂·勃朗特","Charlotte Brontë","外国","inner lyric moral dark","温柔不代表没有意志，独立也不代表不渴望被理解。","第一人称鲜明，情感强烈，关注女性尊严、自我意识与独立。","你在意人物内心和自我选择，喜欢情绪浓烈的角色。","部分情节带有十九世纪小说的戏剧化风格。","《简·爱》"],
["村上春树","Haruki Murakami","外国","inner imagine lyric plain","孤独不一定要解释，有时候只需要陪它待一会儿。","现实与梦境交错，善于写孤独、记忆、音乐和疏离感。","你喜欢氛围感与开放式叙事，不急于给所有象征下结论。","人物有时显得疏离，部分性别表达可能引发争议。","《挪威的森林》《海边的卡夫卡》"],
["查尔斯·狄更斯","Charles Dickens","外国","real human plot moral","看见社会的冷硬，也别忘记每个人具体的命运。","人物鲜明，故事性强，交织城市、贫困、阶层与社会批判。","你喜欢有情节的现实主义，也关心环境如何影响命运。","长篇支线较多，部分描写带有时代小说的铺陈感。","《远大前程》《双城记》"],
["J.R.R. 托尔金","J. R. R. Tolkien","外国","imagine plot moral human","想象一个世界，也是在重新思考勇气、责任与归属。","世界观构建完整，语言有神话气质，旅程、友情与选择构成史诗感。","你爱沉浸式世界、古老传说和有分量的冒险。","专有名词和背景设定较多，前期进入门槛偏高。","《霍比特人》《魔戒》"]

const labels={idea:"理性思辨",dark:"清醒深刻",lyric:"文字余韵",inner:"内心探索",real:"现实观察",human:"理解人性",plot:"故事驱动",imagine:"想象力",moral:"价值追问",plain:"简洁准确"};
let pos=0,ans=[],root=document.getElementById("content");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function cover(){root.innerHTML=`<div class="eyebrow">A LITTLE TEST OF LITERARY TASTE</div><h1>测测你的<br><span style="color:var(--wine)">本命作家</span></h1><div class="sub">你最适合看谁的书？</div><div class="cover-art"><div class="big">在文字里，<br>认出另一个自己。<small>30 WRITERS · 25 QUESTIONS</small></div></div><div class="sub">从思维方式、情感共鸣到阅读审美，花几分钟，找到与你精神气质相近的作家。</div><div class="note">不是给你贴标签，也不是文学考试。没有标准答案，选最接近真实的你就好。</div><p class="small">25 道单选题 · 每题 4 个选项<br>中国作家 15 位 · 外国作家 15 位<br>完成后自动生成匹配结果与阅读建议</p><button class="btn primary" id="start">开始测试　→</button>`;document.getElementById("start").onclick=()=>{pos=0;ans=[];question()}}
function question(){let q=Q[pos];root.innerHTML=`<div class="progress"><span>本命作家测试</span><span>${pos+1} / 25</span></div><div class="track"><div class="fill" style="width:${(pos+1)*4}%"></div></div><div class="qnum">QUESTION ${String(pos+1).padStart(2,"0")}</div><h2>${esc(q[0])}</h2><div class="hint">选最接近你真实想法的一项，不必纠结。</div><div class="options">${q[1].map((v,i)=>`<button class="opt ${ans[pos]===i?"selected":""}" data-i="${i}"><span class="letter">${"ABCD"[i]}</span><span>${esc(v)}</span></button>`).join("")}</div><div class="nav"><button class="btn quiet" id="prev">${pos===0?"返回封面":"← 上一题"}</button><button class="btn primary" id="next" ${ans[pos]===undefined?"disabled":""}>${pos===24?"查看我的结果":"下一题 →"}</button></div>`;root.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[pos]=+b.dataset.i;question()});document.getElementById("prev").onclick=()=>{if(pos===0)cover();else{pos--;question()}};document.getElementById("next").onclick=()=>{if(ans[pos]===undefined)return;if(pos<24){pos++;question()}else result()}}
function result(){let scores={};A.forEach((a,i)=>scores[i]=0);let totals={};ans.forEach((v,i)=>Q[i][2][v].forEach(t=>totals[t]=(totals[t]||0)+1));A.forEach((a,i)=>a[3].split(" ").forEach(t=>scores[i]+=(totals[t]||0)));let ranked=A.map((a,i)=>({a,i,s:scores[i]})).sort((x,y)=>y.s-x.s||x.i-y.i),a=ranked[0].a;root.innerHTML=`<div class="eyebrow">YOUR LITERARY SOULMATE</div><h2 style="font-size:29px">你的本命作家，<br>已经浮现。</h2><div class="result-card"><div class="eyebrow">${a[2]}作家 · PERSONAL MATCH</div><div class="author-name">${esc(a[0])}</div><div class="author-en">${esc(a[1])}</div><div class="quote">“${esc(a[4])}”</div><span class="tag">${a[2]}文学</span><span class="tag">审美倾向匹配</span><span class="tag">仅供阅读参考</span><p class="small">结果根据你的答案进行文学审美匹配，不是科学测量或人格定论。</p></div><div class="section-title">01 / 为什么是这位作家？</div><div class="bodycopy">${esc(a[5])}</div><div class="section-title">02 / 你可能是这样的读者</div><div class="bodycopy">${esc(a[6])}</div><div class="section-title">03 / 一点点阅读提醒</div><div class="bodycopy">${esc(a[7])}</div><div class="section-title">04 / 从哪本书开始？</div><div class="bodycopy">${esc(a[8])}</div><div class="section-title">与你气质相近的另外两位</div><div class="small">文学口味没有唯一答案，以下也是本次得分靠前的选择。</div>${ranked.slice(1,3).map(x=>`<div class="match"><div><div class="match-name">${esc(x.a[0])}</div><div class="small">${esc(x.a[1])} · ${x.a[2]}</div></div><span style="color:var(--wine);font-size:12px">也值得一读</span></div>`).join("")}<div class="section-title">你的阅读气质关键词</div>${a[3].split(" ").slice(0,3).map(t=>`<span class="tag">${labels[t]}</span>`).join("")}<div class="section-title">留给自己的话</div><div class="bodycopy">你不必与一位作家完全相似，也不必喜欢他的每一本书。所谓本命，也许只是某个时刻，他恰好替你看见了一件事。</div><div class="actions"><button class="btn primary" id="again">↻　重新测试</button><button class="btn quiet" id="copy">复制结果文案</button></div><p class="small" id="msg"></p>`;document.getElementById("again").onclick=cover;document.getElementById("copy").onclick=()=>{let txt=`测测我的本命作家｜${a[0]}（${a[1]}）\n\n${a[4]}\n\n写作亮点：${a[5]}\n\n适合这样的读者：${a[6]}\n\n阅读提醒：${a[7]}\n\n入门书单：${a[8]}\n\n愿我们都能在书里认出一点自己。`;let msg=document.getElementById("msg");if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>msg.textContent="结果文案已复制，可以粘贴分享。").catch(()=>manual(txt,msg));else manual(txt,msg)}}
function manual(txt,msg){let ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");msg.textContent="已尝试复制结果文案。"}catch(e){msg.textContent="复制失败，请截图保存结果。"}ta.remove()}
cover();
</script></body></html>
